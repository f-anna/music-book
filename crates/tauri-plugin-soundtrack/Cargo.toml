[package]
name = "tauri-plugin-soundtrack"
version = "0.1.0"
authors = ["f-anna"]
description = "Mood-tracking background music for e-book readers (Tauri v2 plugin)"
edition = "2024"
rust-version = "1.90"
exclude = ["/guest-js", "/node_modules"]
links = "tauri-plugin-soundtrack"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
# 0.x: breaking API changes are possible, hence the exact version.
rbook = { version = "=0.7.12", default-features = false, features = ["threadsafe"] }
scraper = "0.29"
ego-tree = "0.11"
sha2 = "0.10"
serde_json = "1"
# Plain HTTP to the local llama-server: no TLS (saves the aws-lc-rs C build).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
# Must share libsqlite3-sys with the host's sqlx 0.9 (<0.38): rusqlite 0.39 uses 0.37.
rusqlite = { version = "0.39", features = ["bundled"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
