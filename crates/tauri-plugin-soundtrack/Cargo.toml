[package]
name = "tauri-plugin-soundtrack"
version = "0.1.0"
authors = ["f-anna"]
description = "Mood-tracking background music for e-book readers (Tauri v2 plugin)"
edition = "2024"
rust-version = "1.90"
exclude = ["/guest-js", "/node_modules"]
links = "tauri-plugin-soundtrack"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
# 0.x: breaking API changes are possible, hence the exact version.
rbook = { version = "=0.7.12", default-features = false, features = ["threadsafe"] }
scraper = "0.29"
ego-tree = "0.11"
sha2 = "0.10"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
